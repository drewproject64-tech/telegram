services:
  - type: web
    name: telegram-ads-chatgpt-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_ADS_TOKEN
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: ENABLE_WRITES
        value: "false"
